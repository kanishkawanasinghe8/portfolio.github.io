<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cfdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#0f1422" />
    </linearGradient>
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#7ef3c4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cfdBg)"/>

  <!-- Airfoil (NACA 0012 Profile) -->
  <g transform="translate(180, 240) rotate(-6)">
    <!-- Aerodynamic Streamlines Over Camber (Suction side - high velocity / low pressure) -->
    <path d="M -160 -100 Q 120 -220 540 -120" fill="none" stroke="url(#streamGrad1)" stroke-width="3"/>
    <path d="M -160 -60 Q 130 -160 540 -70" fill="none" stroke="url(#streamGrad1)" stroke-width="4"/>
    <path d="M -160 -20 Q 140 -90 540 -30" fill="none" stroke="url(#streamGrad1)" stroke-width="3"/>
    <path d="M -160 0 Q 100 -40 540 -5" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5"/>

    <!-- Pressure Side Streamlines (Under surface) -->
    <path d="M -160 30 Q 120 70 540 20" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5"/>
    <path d="M -160 70 Q 120 120 540 50" fill="none" stroke="url(#streamGrad2)" stroke-width="3"/>
    <path d="M -160 120 Q 120 170 540 90" fill="none" stroke="url(#streamGrad2)" stroke-width="2"/>

    <!-- Wing Cross-Section -->
    <path d="M 50 0 C 80 -60, 220 -50, 360 0 C 260 20, 100 20, 50 0 Z" 
          fill="#111827" stroke="#7ef3c4" stroke-width="2.5"/>
    <circle cx="90" cy="-10" r="4" fill="#38bdf8"/>
    <circle cx="360" cy="0" r="3" fill="#7ef3c4"/>
  </g>

  <!-- Velocity Vector Field Arrows & Flow Indicators -->
  <g font-family="monospace" font-size="11" fill="#7ef3c4">
    <!-- Boundary layer separation callout -->
    <path d="M 460 200 L 530 140 L 610 140" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <circle cx="460" cy="200" r="3" fill="#fbbf24"/>
    <text x="620" y="136" fill="#fbbf24" font-weight="bold">BOUNDARY LAYER TURBULENCE</text>
    <text x="620" y="152" fill="#94a3b8">k-ω SST MODEL // Re = 1.2 × 10⁶</text>

    <!-- Stagnation Point -->
    <path d="M 210 245 L 140 290 L 70 290" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <circle cx="210" cy="245" r="3" fill="#38bdf8"/>
    <text x="60" y="286" fill="#38bdf8" text-anchor="end">STAGNATION POINT</text>
    <text x="60" y="302" fill="#94a3b8" text-anchor="end">Cp = +1.0 // V = 0 m/s</text>

    <!-- Inflow Vector -->
    <g transform="translate(40, 230)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#7ef3c4" stroke-width="3"/>
      <polygon points="60,0 48,-6 48,6" fill="#7ef3c4"/>
      <text x="0" y="-10" fill="#7ef3c4" font-weight="bold">U_inf = 45 m/s</text>
    </g>
  </g>

  <!-- Bottom Specs HUD -->
  <text x="40" y="460" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">ANSYS FLUENT // COMPRESSIBLE NAVIER-STOKES // MESH: 3.4M POLYHEDRAL CELLS</text>
  <text x="760" y="460" font-family="monospace" font-size="11" fill="#7ef3c4" text-anchor="end">L/D RATIO: 18.4</text>
</svg>
