<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="suspBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0e" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#suspBg)"/>

  <!-- Formula Student / Racecar Double-Wishbone Suspension Geometry -->
  <g transform="translate(180, 100)">
    <!-- Chassis Hardpoints (Left Column) -->
    <rect x="40" y="60" width="20" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="220" width="20" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="50" y1="20" x2="50" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Upper Control Arm (A-Arm) -->
    <polygon points="50,80 340,120 330,135 50,95" fill="rgba(126,243,196,0.15)" stroke="#7ef3c4" stroke-width="2.5"/>

    <!-- Lower Control Arm (A-Arm) -->
    <polygon points="50,240 360,260 350,278 50,258" fill="rgba(126,243,196,0.15)" stroke="#7ef3c4" stroke-width="2.5"/>

    <!-- Upright / Knuckle (Connecting Upper & Lower Ball Joints) -->
    <path d="M 335 125 L 355 270 L 390 270 L 380 200 L 440 200 L 440 180 L 375 180 L 360 125 Z" 
          fill="#1b2234" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wheel Hub & Brake Rotor -->
    <rect x="440" y="140" width="16" height="100" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Wheel Rim profile -->
    <rect x="465" y="60" width="40" height="260" rx="4" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

    <!-- Coilover Shock / Damper with Spring -->
    <line x1="120" y1="245" x2="220" y2="70" stroke="#fbbf24" stroke-width="8"/>
    <!-- Spring coils -->
    <path d="M 140 210 Q 170 210 160 180 Q 150 150 180 150 Q 210 150 200 120 Q 190 90 220 90" 
          fill="none" stroke="#ef4444" stroke-width="4"/>
    <circle cx="120" cy="245" r="7" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="220" cy="70" r="7" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Kinematic Callouts -->
  <g font-family="monospace" font-size="12">
    <!-- Camber gain -->
    <path d="M 525 220 L 590 170 L 670 170" stroke="#7ef3c4" stroke-width="1.5" fill="none"/>
    <circle cx="525" cy="220" r="3" fill="#7ef3c4"/>
    <text x="680" y="166" fill="#7ef3c4" font-weight="bold">DYNAMIC CAMBER: -2.2°</text>
    <text x="680" y="184" fill="#94a3b8">ROLL CENTER: 42 mm ABOVE GROUND</text>

    <!-- Spring rate -->
    <path d="M 330 200 L 260 270 L 160 270" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <circle cx="330" cy="200" r="3" fill="#fbbf24"/>
    <text x="150" y="266" fill="#fbbf24" font-weight="bold" text-anchor="end">MOTION RATIO: 0.78</text>
    <text x="150" y="284" fill="#94a3b8" text-anchor="end">SPRING RATE: 350 lbs/in</text>
  </g>

  <!-- HUD Specs -->
  <text x="40" y="460" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">CHASSIS KINEMATICS &amp; COMPLIANCE // LOTUS SHARK // FORMULA SAE</text>
  <text x="760" y="460" font-family="monospace" font-size="11" fill="#7ef3c4" text-anchor="end">WEIGHT: 3.4 kg / CORNER</text>
</svg>
