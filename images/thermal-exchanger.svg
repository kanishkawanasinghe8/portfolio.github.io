<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14" />
      <stop offset="100%" stop-color="#151b2a" />
    </linearGradient>
    <linearGradient id="hotFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coldFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#heatBg)"/>

  <!-- Microchannel Heat Exchanger Isometric Core -->
  <g transform="translate(240, 100)">
    <!-- Outer Housing Frame -->
    <polygon points="160,20 340,110 180,260 0,170" fill="rgba(30, 41, 59, 0.6)" stroke="#7ef3c4" stroke-width="2"/>
    <polygon points="0,170 180,260 180,310 0,220" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <polygon points="180,260 340,110 340,160 180,310" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

    <!-- Microchannel Fin Layers (Hot/Cold Alternating Plates) -->
    <g stroke="url(#hotFlow)" stroke-width="3">
      <line x1="40" y1="150" x2="200" y2="240"/>
      <line x1="60" y1="130" x2="220" y2="220"/>
      <line x1="80" y1="110" x2="240" y2="200"/>
      <line x1="100" y1="90" x2="260" y2="180"/>
      <line x1="120" y1="70" x2="280" y2="160"/>
    </g>

    <g stroke="url(#coldFlow)" stroke-width="2.5" stroke-dasharray="6 3">
      <line x1="50" y1="140" x2="210" y2="230"/>
      <line x1="70" y1="120" x2="230" y2="210"/>
      <line x1="90" y1="100" x2="250" y2="190"/>
      <line x1="110" y1="80" x2="270" y2="170"/>
    </g>
  </g>

  <!-- Heat Transfer Indicators -->
  <g font-family="monospace" font-size="12">
    <!-- Hot Inlet -->
    <path d="M 120 180 L 220 220" stroke="#ef4444" stroke-width="3" fill="none"/>
    <polygon points="220,220 206,213 212,228" fill="#ef4444"/>
    <text x="30" y="170" fill="#ef4444" font-weight="bold">HOT FLUID INLET: 85°C</text>
    <text x="30" y="188" fill="#94a3b8">MASS FLOW: 0.15 kg/s</text>

    <!-- Cold Outlet -->
    <path d="M 580 250 L 680 210" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <polygon points="680,210 666,204 668,219" fill="#38bdf8"/>
    <text x="770" y="210" fill="#38bdf8" font-weight="bold" text-anchor="end">COOLANT OUTLET: 38°C</text>
    <text x="770" y="228" fill="#94a3b8" text-anchor="end">EFFICIENCY ε = 88.4%</text>

    <!-- Heat Dissipation Callout -->
    <path d="M 420 280 L 420 370 L 490 370" stroke="#7ef3c4" stroke-width="1.5" fill="none"/>
    <circle cx="420" cy="280" r="3" fill="#7ef3c4"/>
    <text x="500" y="366" fill="#7ef3c4" font-weight="bold">TOTAL HEAT FLUX: 4.8 kW</text>
    <text x="500" y="382" fill="#94a3b8">PRESSURE DROP ΔP &lt; 12.5 kPa</text>
  </g>

  <!-- Telemetry HUD -->
  <text x="40" y="460" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">THERMAL SIMULATION // CONJUGATE HEAT TRANSFER // ADDITIVE ALSi10Mg</text>
  <text x="760" y="460" font-family="monospace" font-size="11" fill="#7ef3c4" text-anchor="end">STATUS: BENCH TESTED</text>
</svg>
