<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="robotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <linearGradient id="armGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ef3c4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#robotBg)"/>

  <!-- Radial Polar Coordinate Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <circle cx="280" cy="380" r="100" fill="none"/>
    <circle cx="280" cy="380" r="200" fill="none"/>
    <circle cx="280" cy="380" r="300" fill="none" stroke-dasharray="4 4"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <!-- Robotic Arm Mechanism (6-DOF Kinematics Articulation) -->
  <g id="robot-mechanism">
    <!-- Pedestal Base -->
    <rect x="220" y="380" width="120" height="40" rx="6" fill="#1b2234" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="250" y="360" width="60" height="20" rx="4" fill="#0f1422" stroke="#7ef3c4" stroke-width="2"/>

    <!-- Joint 1: Base Yaw Joint -->
    <circle cx="280" cy="360" r="16" fill="#090b10" stroke="#7ef3c4" stroke-width="3"/>

    <!-- Link 1 (Shoulder) -->
    <line x1="280" y1="360" x2="350" y2="210" stroke="#334155" stroke-width="28" stroke-linecap="round"/>
    <line x1="280" y1="360" x2="350" y2="210" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

    <!-- Joint 2: Shoulder Pitch Joint -->
    <circle cx="350" cy="210" r="22" fill="#1b2234" stroke="#7ef3c4" stroke-width="3"/>
    <circle cx="350" cy="210" r="8" fill="#7ef3c4"/>

    <!-- Link 2 (Forearm) -->
    <line x1="350" y1="210" x2="520" y2="150" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
    <line x1="350" y1="210" x2="520" y2="150" stroke="#7ef3c4" stroke-width="4" stroke-linecap="round"/>

    <!-- Joint 3: Elbow Joint -->
    <circle cx="520" cy="150" r="18" fill="#1b2234" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="520" cy="150" r="6" fill="#38bdf8"/>

    <!-- Link 3 (Wrist) -->
    <line x1="520" y1="150" x2="620" y2="220" stroke="#334155" stroke-width="14" stroke-linecap="round"/>

    <!-- End Effector / Two-Finger Parallel Gripper -->
    <g transform="translate(620, 220) rotate(35)">
      <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#7ef3c4"/>
      <!-- Finger 1 -->
      <path d="M 10 -6 L 26 -12 L 32 -6" stroke="#7ef3c4" stroke-width="3" fill="none"/>
      <!-- Finger 2 -->
      <path d="M 10 6 L 26 12 L 32 6" stroke="#7ef3c4" stroke-width="3" fill="none"/>
      <!-- Picked Component -->
      <circle cx="30" cy="0" r="6" fill="#38bdf8"/>
    </g>

    <!-- Kinematics Trajectory Curve -->
    <path d="M 640 235 Q 560 300 480 340" fill="none" stroke="rgba(126,243,196,0.5)" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Technical Telemetry & Kinematics Callouts -->
  <g font-family="monospace" font-size="12" fill="#7ef3c4">
    <!-- Joint 2 telemetry -->
    <path d="M 350 210 L 260 160 L 160 160" stroke="#7ef3c4" stroke-width="1" fill="none"/>
    <circle cx="350" cy="210" r="3" fill="#7ef3c4"/>
    <text x="150" y="155" fill="#7ef3c4" text-anchor="end">DOF-2: BLDC HARMONIC DRIVE</text>
    <text x="150" y="172" fill="#94a3b8" font-size="10" text-anchor="end">θ₁ = 64.8° // TORQUE: 45 N·m</text>

    <!-- End effector telemetry -->
    <path d="M 645 220 L 710 180 L 760 180" stroke="#38bdf8" stroke-width="1" fill="none"/>
    <circle cx="645" cy="220" r="3" fill="#38bdf8"/>
    <text x="760" y="175" fill="#38bdf8">PAYLOAD: 2.5 kg</text>
    <text x="760" y="192" fill="#94a3b8" font-size="10">POSITION ERROR &lt; 0.05 mm</text>
  </g>

  <!-- HUD Specs Bottom -->
  <text x="40" y="460" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)">ROS2 (HUMBLE) // INVERSE KINEMATICS SOLVER // MATLAB SIMULINK</text>
  <text x="760" y="460" font-family="monospace" font-size="11" fill="#7ef3c4" text-anchor="end">CYCLE TIME: 1.8s</text>
</svg>
